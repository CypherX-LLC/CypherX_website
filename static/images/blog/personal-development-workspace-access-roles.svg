  <text x="320" y="80" fill="#202343" font-family="Arial, sans-serif" font-size="32" font-weight="700">Roles and access</text><text x="320" y="113" fill="#737894" font-family="Arial, sans-serif" font-size="17">Control which development data each role can view.</text><rect x="1358" y="58" width="182" height="46" rx="12" fill="#6874d8"/><text x="1398" y="87" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Add role</text>
