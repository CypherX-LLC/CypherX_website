<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal Development Workspace access and roles</title>
  <desc id="desc">An access-management screen with role permissions and Frappe LMS integration settings.</desc>
